<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="robots" content="noindex">
    
    <title data-i18n="seminarios.titulo_pagina">Seminários - PPGEB UNIFESP</title>
 

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/nav.css">         
    <link rel="stylesheet" href="styles/seminarios.css">
    <!-- i18n (deve vir antes dos demais scripts) -->
    <script src="JS/i18n.js"></script>
</head>

<body>
    <!-- Header -->
    <header class="header header-blue-bg">
        <div class="header-container">
            <div class="logo">
                <img alt="Logo PPGEB" class="logo-img" src="imgs/logo.png" data-i18n-attr="alt:comum.logo_ppgeb" />
            </div>

            <nav class="nav" id="nav"></nav>

            <button class="mobile-menu-btn" id="mobile-menu-btn">
                <span>☰</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-m features-2" style="margin-top:2rem!important;">
        <div class="container">
            <!-- Page Header -->
            <section class="selection-section">
                <div class="selection-header">
                    <h2 data-i18n="seminarios.titulo">Seminários em Engenharia Biomédica</h2>
                    <p data-i18n="seminarios.subtitulo">Ciclos de palestras e eventos acadêmicos do programa</p>
                </div>
                <div class="semester-selector">
                    <label for="semesterSelect" data-i18n="seminarios.selecione_periodo">Selecione o período:</label>
                    <div class="custom-select-wrapper">
                        <select id="semesterSelect" class="semester-select">
                            <option disabled selected data-i18n="seminarios.carregando_periodos">Carregando períodos...</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Seminars Section -->
            <section class="seminars-section" id="seminarsSection">
                <div class="">
                    <div class="titles" id="areas" style="margin-top: 1.5rem;">
                        <h1 id="semesterTitle">II Ciclo de Seminários em Engenharia Biomédica - 2022</h1>
                    </div>
                </div>

                <!-- Seminars List -->
                <div class="seminar-category">                 
                    <div class="seminars-list">
                        <div class="no-seminars">
                            <p data-i18n="seminarios.carregando">Carregando seminários...</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal for Seminar Cover -->
    <div id="coverModal" class="custom-modal">
        <div class="custom-modal-content modern">
            <span class="custom-close">&times;</span>
            <div class="modal-cover-content">
                <img id="modalCoverImage" src="" alt="" style="width: 100%; max-width: 500px; height: auto; border-radius: 12px;">
                <h3 id="modalCoverTitle" style="margin-top: 1rem; color: var(--dark-text);"></h3>
                <p id="modalCoverSpeaker" style="color: var(--primary-blue); font-style: italic;"></p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="JS/seminarios.js"></script>
    <script src="JS/menu.js"></script>
    <script src="JS/script.js"></script>

    <script>
        carregarMenu("S");    
    </script>

</body>

</html>
