<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post de Disciplinas - Instagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Dependências -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .instagram-square {
            width: 1080px;
            height: 1080px;
            background-color: #0a192f;
            flex-shrink: 0;
        }
        .carousel-preview {
            display: flex;
            flex-direction: column;
            gap: 60px;
            align-items: center;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body class="flex flex-col items-center py-10 px-4">

    <!-- Painel de Controle -->
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-5xl mb-6 flex flex-col gap-4 border border-blue-100 z-20 relative">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-900">Gerador de Oferta Acadêmica (Carrossel)</h1>
            <a href="index.html" class="text-sm font-medium text-blue-600 hover:underline">Ir para Defesas &rarr;</a>
        </div>
        
        <div class="grid grid-cols-1 gap-4 mt-2">
            <div>
                <label for="semestre" class="block text-sm font-medium text-slate-700 mb-1">Selecione o Semestre</label>
                <select id="semestre" class="block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    <option value="">Carregando...</option>
                </select>
            </div>
        </div>

        <div class="mt-4 flex justify-between items-center">
            <span id="info-text" class="text-sm text-slate-500 font-medium"></span>
            <button id="btn-download" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                Baixar Carrossel (ZIP)
            </button>
        </div>
    </div>

    <!-- Container das Artes -->
    <div class="w-full flex flex-col items-center mb-20">
        <div id="carousel-container" class="carousel-preview">
            <div class="flex items-center justify-center w-full h-full text-slate-500 mt-10">
                Selecione um semestre para gerar as artes (1080x1080).
            </div>
        </div>
    </div>

    <script>
       // Ícones SVG
       const icons = {
           cap: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>',
           book: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>',
           user: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
           clock: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
           pin: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>'
       };

       document.addEventListener('DOMContentLoaded', async () => {
            let dataJSON = {};
            const selectSemestre = document.getElementById('semestre');
            const carouselContainer = document.getElementById('carousel-container');
            const btnDownload = document.getElementById('btn-download');
            const infoText = document.getElementById('info-text');

            // Formata o ID do semestre (ex: 2026-1)
            function formatSemester(key) {
                const [ano, semestre] = key.split("-");
                const nomes = { "1": "Primeiro", "2": "Segundo" };
                return `${nomes[semestre] || semestre + "º"} Semestre de ${ano}`;
            }

            try {
                // Fetch os dados
                const response = await fetch('../JSON/oferta_disciplinas.json');
                if (!response.ok) throw new Error('Falha no fetch');
                dataJSON = await response.json();

                selectSemestre.innerHTML = '<option value="">Selecione...</option>';
                const keys = Object.keys(dataJSON).sort().reverse();
                for (const key of keys) {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = dataJSON[key].titulo || formatSemester(key);
                    selectSemestre.appendChild(option);
                }
            } catch (error) {
                console.error(error);
                alert('Erro ao carregar o arquivo JSON. Lembre-se de rodar num servidor local.');
                selectSemestre.innerHTML = '<option value="">Erro ao carregar</option>';
            }

            selectSemestre.addEventListener('change', () => {
                const key = selectSemestre.value;
                carouselContainer.innerHTML = '';
                btnDownload.disabled = true;
                infoText.textContent = '';

                if (!key || !dataJSON[key]) {
                    carouselContainer.innerHTML = '<div class="flex items-center justify-center w-full h-full text-slate-500 mt-10">Selecione um semestre para gerar as artes (1080x1080).</div>';
                    return;
                }

                const disciplinas = dataJSON[key].disciplinas;
                if (!disciplinas || disciplinas.length === 0) {
                    infoText.textContent = 'Nenhuma disciplina encontrada neste semestre.';
                    carouselContainer.innerHTML = '<div class="flex items-center justify-center w-full h-full text-slate-500 mt-10">Nenhuma disciplina cadastrada para o semestre selecionado.</div>';
                    return;
                }

                const titleText = formatSemester(key);
                
                // Divisão em páginas de no máximo 2 itens
                const chunks = [];
                for (let i = 0; i < disciplinas.length; i += 2) {
                    chunks.push(disciplinas.slice(i, i + 2));
                }

                infoText.textContent = `${disciplinas.length} disciplinas geraram ${chunks.length} arte(s).`;

                chunks.forEach((chunk, pageIndex) => {
                    let disciplinasHTML = '';
                    chunk.forEach(item => {
                        disciplinasHTML += `
                            <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-3xl p-10 flex items-start gap-8 hover:bg-white/10 transition-colors">
                                <div class="mt-1 bg-blue-600/20 p-5 rounded-2xl text-blue-300 shrink-0">
                                    <div class="w-10 h-10 [&>svg]:w-full [&>svg]:h-full">${icons.book}</div>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h2 class="text-[26px] font-black uppercase text-blue-50 mb-6">
                                        ${item.nome}
                                    </h2>
                                    <div class="flex flex-col gap-4">
                                        <div class="flex items-center gap-3 text-[20px] text-slate-300">
                                            <div class="w-6 h-6 text-blue-400 shrink-0 [&>svg]:w-full [&>svg]:h-full">${icons.user}</div>
                                            <span class="truncate">${item.docente}</span>
                                        </div>
                                        <div class="flex items-center gap-3 text-[20px] text-slate-300">
                                            <div class="w-6 h-6 text-blue-400 shrink-0 [&>svg]:w-full [&>svg]:h-full">${icons.clock}</div>
                                            <span>${item.horario || 'A definir'}</span>
                                        </div>
                                        <div class="flex items-center gap-3 text-[20px] text-slate-300">
                                            <div class="w-6 h-6 text-blue-400 shrink-0 [&>svg]:w-full [&>svg]:h-full">${icons.pin}</div>
                                            <span class="truncate">${item.unidade || 'Local não definido'} ${item.local ? '- ' + item.local : ''}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    const slide = document.createElement('div');
                    slide.className = "post-canvas instagram-square relative overflow-hidden flex flex-col p-16 text-white border border-white/10 shadow-2xl shrink-0";
                    
                    slide.innerHTML = `
                        <!-- Fundo IA substituído por gradiente para JS Vanilla (estático) -->
                        <div class="absolute inset-0 bg-gradient-to-b from-[#0f2027] via-[#203a43] to-[#2c5364] z-0 opacity-95"></div>

                        <!-- Conteúdo Principal -->
                        <div class="relative z-10 flex flex-col h-full">
                            
                            <!-- Cabeçalho -->
                            <div class="flex justify-between items-center mb-12">
                                <div class="space-y-3">
                                    <span class="bg-blue-600/80 px-6 py-1.5 rounded text-[16px] font-black uppercase inline-block">
                                        OFERTA ACADÊMICA
                                    </span>
                                    <h1 class="text-4xl font-black italic text-white drop-shadow-md">
                                        ${titleText.toUpperCase()}
                                    </h1>
                                </div>
                                <div class="w-16 h-16 text-blue-300 opacity-50 [&>svg]:w-full [&>svg]:h-full">
                                    ${icons.cap}
                                </div>
                            </div>

                            <!-- Grade de Disciplinas -->
                            <div class="flex-1 grid grid-cols-1 gap-10 content-start mt-4">
                                ${disciplinasHTML}
                            </div>

                            <!-- Rodapé de Paginação -->
                            <div class="mt-12 bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl p-6 flex justify-between items-center shadow-lg">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 text-blue-300 [&>svg]:w-full [&>svg]:h-full">${icons.pin}</div>
                                    <div class="flex flex-col">
                                        <span class="text-[14px] font-black uppercase text-blue-400">Página do Post</span>
                                        <span class="text-[20px] font-bold">Imagem ${pageIndex + 1} de ${chunks.length}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Assinatura -->
                            <div class="mt-8 text-center">
                                <span class="text-[16px] font-black uppercase opacity-40">
                                    Engenharia Biomédica • PPGEB
                                </span>
                            </div>
                        </div>
                    `;

                    carouselContainer.appendChild(slide);
                });

                btnDownload.disabled = false;
            });

            btnDownload.addEventListener('click', async () => {
                const slides = document.querySelectorAll('.post-canvas');
                if (slides.length === 0) return;

                btnDownload.disabled = true;
                const originalText = btnDownload.innerText;
                btnDownload.innerText = 'Gerando ZIP...';

                try {
                    // Aguarda todas as fontes (incluindo o Google Fonts 'Inter') serem carregadas
                    // Isso evita bugs no html2canvas que causam sobreposição e achatamento das letras
                    await document.fonts.ready;

                    const zip = new JSZip();
                    
                    for (let i = 0; i < slides.length; i++) {
                        const el = slides[i];
                        
                        const canvas = await html2canvas(el, {
                            scale: 1,
                            useCORS: true,
                            backgroundColor: null
                        });
                        
                        // Extrai apenas o código Base64
                        const dataUrl = canvas.toDataURL('image/png');
                        const base64Data = dataUrl.split(',')[1];
                        zip.file(`disciplina_post_${i + 1}.png`, base64Data, { base64: true });
                    }

                    // Gera o arquivo ZIP
                    const content = await zip.generateAsync({ type: 'blob' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    const semesterName = selectSemestre.value || 'oferta';
                    link.download = `carrossel_disciplinas_${semesterName}.zip`;
                    link.click();

                } catch (error) {
                    console.error('Erro na geração das imagens:', error);
                    alert('Ocorreu um erro ao gerar o arquivo ZIP. Verifique o console.');
                } finally {
                    btnDownload.innerText = originalText;
                    btnDownload.disabled = false;
                }
            });

       });
    </script>
</body>
</html>
