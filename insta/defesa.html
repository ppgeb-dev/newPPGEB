<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post de Defesa - Instagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Adicionando html2canvas para gerar o PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .instagram-square {
            width: 1080px;
            height: 1080px;
            transform: scale(0.6); 
            transform-origin: top center;
        }
        @media (max-width: 700px) {
            .instagram-square {
                transform: scale(0.35);
            }
        }
        .preview-wrapper {
            height: 700px;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        @media (max-width: 700px) {
            .preview-wrapper {
                height: 400px;
            }
        }
    </style>
</head>
<body class="flex flex-col items-center py-10 px-4">

    <!-- Painel de Controle -->
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-4xl mb-10 flex flex-col gap-4 border border-blue-100 z-20 relative">
        <h1 class="text-2xl font-bold text-blue-900 mb-2">Gerador de Post para o Instagram</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="semestre" class="block text-sm font-medium text-slate-700 mb-1">Semestre / Ano</label>
                <select id="semestre" class="block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    <option value="">Carregando...</option>
                </select>
            </div>
            
            <div>
                <label for="defesa" class="block text-sm font-medium text-slate-700 mb-1">Defesa</label>
                <select id="defesa" class="block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" disabled>
                    <option value="">Selecione um semestre primeiro...</option>
                </select>
            </div>
        </div>

        <div class="mt-4 flex justify-end">
            <button id="btn-download" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                Baixar Imagem (PNG)
            </button>
        </div>
    </div>

    <!-- Container de Visualização -->
    <div class="preview-wrapper">
        <div id="post-capture" class="instagram-square shadow-2xl overflow-hidden relative flex flex-col justify-between p-24 bg-gradient-to-br from-slate-900 via-blue-900 to-blue-800">
            
            <!-- Elementos Decorativos de Fundo -->
            <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-white opacity-5 rounded-full -mr-40 -mt-40 blur-[100px]"></div>
            <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-blue-400 opacity-10 rounded-full -ml-40 -mb-40 blur-[100px]"></div>

            <!-- Barra Superior -->
            <div class="relative z-10 flex justify-between items-start">
                <div class="px-10 py-4 bg-white/10 text-white rounded-full text-2xl font-bold tracking-[0.2em] uppercase backdrop-blur-sm">
                    PPGEB
                </div>
                
                <!-- Ícone de Capelo (SVG) -->
                <div class="text-white/30 -mr-4 -mt-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                    </svg>
                </div>
            </div>

            <!-- Conteúdo Centralizado -->
            <div class="relative z-10 flex flex-col items-center text-center space-y-12 px-10">
                <div class="space-y-8">
                    <!-- Tipo de Defesa -->
                    <span class="text-4xl font-bold uppercase tracking-[0.3em] text-blue-300 block">
                        Defesa de Dissertação de Mestrado
                    </span>
                    
                    <!-- Título -->
                    <h2 id="view-titulo" class="text-4xl font-black leading-tight uppercase text-white">
                        TÍTULO DA DEFESA
                    </h2>
                </div>

                <div class="space-y-4">
                    <p id="view-candidato-label" class="text-2xl uppercase tracking-[0.4em] text-white/60">Candidato(a)</p>
                    <p id="view-aluno" class="text-6xl font-bold text-white">
                        Nome do Aluno
                    </p>
                </div>
            </div>

            <!-- Rodapé / Info Card -->
            <div class="relative z-10 p-12 rounded-[40px] flex justify-around items-center bg-white/10 backdrop-blur-xl border border-white/20">
                <!-- Data -->
                <div class="flex flex-col items-center gap-3">
                    <div class="flex items-center gap-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y1="6"></line><line x1="8" y1="2" x2="8" y1="6"></line><line x1="3" y1="10" x2="21" y1="10"></line></svg>
                        <span class="text-2xl font-black uppercase tracking-widest text-white">Data</span>
                    </div>
                    <span id="view-data" class="text-3xl text-white/90">00 de mês de 0000</span>
                </div>

                <!-- Divisor -->
                <div class="w-px h-24 bg-white/20"></div>
                
                <!-- Local -->
                <div class="flex flex-col items-center gap-3">
                    <div class="flex items-center gap-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <span class="text-2xl font-black uppercase tracking-widest text-white">Local</span>
                    </div>
                    <span id="view-local" class="text-3xl text-white/90">Local</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Área de Texto para Postagem -->
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-4xl mt-6 mb-10 flex flex-col gap-4 border border-blue-100 z-20 relative">
        <h2 class="text-xl font-bold text-blue-900">Texto para a Postagem</h2>
        <textarea id="post-text" class="block w-full py-3 px-4 border border-gray-300 bg-gray-50 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm resize-none" rows="12" readonly>Selecione uma defesa para gerar o texto.</textarea>
        <div class="flex justify-end">
            <button id="btn-copy" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-2 px-6 rounded shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                Copiar Texto
            </button>
        </div>
    </div>

    <!-- Script da Aplicação -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let agendaData = {};

            const selectSemestre = document.getElementById('semestre');
            const selectDefesa = document.getElementById('defesa');
            const btnDownload = document.getElementById('btn-download');

            const viewTitulo = document.getElementById('view-titulo');
            const viewAluno = document.getElementById('view-aluno');
            const viewData = document.getElementById('view-data');
            const viewLocal = document.getElementById('view-local');
            const captureArea = document.getElementById('post-capture');
            const postText = document.getElementById('post-text');
            const btnCopy = document.getElementById('btn-copy');

            try {
                // Fetch os dados do JSON (caminho relativo)
                const response = await fetch('../JSON/agenda_defesas.json');
                if (!response.ok) throw new Error('Network response was not ok');
                agendaData = await response.json();
                
                // Preenche o Select de Semestres
                selectSemestre.innerHTML = '<option value="">Selecione...</option>';
                for (const [key, value] of Object.entries(agendaData)) {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = value.titulo;
                    selectSemestre.appendChild(option);
                }
            } catch (error) {
                console.error('Erro ao carregar os dados:', error);
                selectSemestre.innerHTML = '<option value="">Erro ao carregar os dados</option>';
                alert('Não foi possível carregar as defesas. Certifique-se de acessar por um servidor HTTP (ex: Live Server ou Python http.server) e não apenas dando duplo clique no arquivo HTML (file://), pois o navegador bloqueia o carregamento de arquivos locais (CORS).');
            }

            // Atualiza as defesas quando um semestre é escolhido
            selectSemestre.addEventListener('change', (e) => {
                const key = e.target.value;
                selectDefesa.innerHTML = '<option value="">Selecione uma defesa...</option>';
                selectDefesa.disabled = !key;
                btnDownload.disabled = true;
                postText.value = 'Selecione uma defesa para gerar o texto.';
                btnCopy.disabled = true;

                if (key && agendaData[key]) {
                    agendaData[key].defesas.forEach((defesa, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        const shortTitle = defesa.titulo.length > 50 ? defesa.titulo.substring(0, 50) + '...' : defesa.titulo;
                        option.textContent = `${defesa.aluno} - ${shortTitle}`;
                        selectDefesa.appendChild(option);
                    });
                }
            });

            // Atualiza o preview da imagem quando uma defesa é escolhida
            selectDefesa.addEventListener('change', (e) => {
                const keySemestre = selectSemestre.value;
                const indexDefesa = e.target.value;

                if (indexDefesa !== "") {
                    const defesa = agendaData[keySemestre].defesas[indexDefesa];
                    
                    viewTitulo.textContent = defesa.titulo;
                    viewAluno.textContent = defesa.aluno;
                    
                    let dataStr = defesa.data;
                    if (defesa.horario) {
                        dataStr += ` às ${defesa.horario}`;
                    }
                    viewData.textContent = dataStr;
                    viewLocal.textContent = defesa.local || 'Local não definido';

                    btnDownload.disabled = false;
                    
                    // Gera o texto para postagem
                    const horarioStr = defesa.horario ? defesa.horario : '[Inserir Horário se já definido]';
                    const textContent = `🎓 Convite para Defesa de Dissertação de Mestrado

O Programa de Pós-Graduação em Engenharia Biomédica (PPGEB) convida a comunidade acadêmica para a defesa de mestrado da discente ${defesa.aluno}.

🔬 Título: ${defesa.titulo}.

📅 Data: ${defesa.data}
📍 Local: ${defesa.local || 'Local não definido'}
⏰ Horário: ${horarioStr}

Venha prestigiar mais um importante trabalho de pesquisa desenvolvido em nosso programa!`;
                    postText.value = textContent;
                    btnCopy.disabled = false;
                } else {
                    btnDownload.disabled = true;
                    postText.value = 'Selecione uma defesa para gerar o texto.';
                    btnCopy.disabled = true;
                }
            });

            // Lida com o botão de download
            btnDownload.addEventListener('click', async () => {
                btnDownload.disabled = true;
                const originalText = btnDownload.innerText;
                btnDownload.innerText = 'Gerando Imagem...';

                try {
                    // html2canvas renderiza o conteúdo HTML para um <canvas>
                    const canvas = await html2canvas(captureArea, {
                        scale: 1, // Queremos na escala 1x, resultando nos 1080x1080 exatos da div
                        useCORS: true,
                        backgroundColor: null,
                        onclone: (documentClone) => {
                            // No clone, tiramos a escala do CSS para evitar problemas de renderização e gerar a resolução real
                            const el = documentClone.getElementById('post-capture');
                            el.style.transform = 'none';
                        }
                    });
                    
                    // Converte para base64 e realiza o download via âncora invisível
                    const image = canvas.toDataURL('image/png', 1.0);
                    const link = document.createElement('a');
                    link.download = `post_${viewAluno.textContent.trim().replace(/\s+/g, '_')}.png`;
                    link.href = image;
                    link.click();
                    
                } catch (error) {
                    console.error('Erro na geração da imagem:', error);
                    alert('Ocorreu um erro ao gerar o arquivo PNG.');
                } finally {
                    btnDownload.innerText = originalText;
                    btnDownload.disabled = false;
                }
            });

            // Lida com o botão de copiar texto
            btnCopy.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(postText.value);
                    const originalText = btnCopy.innerText;
                    btnCopy.innerText = 'Copiado!';
                    setTimeout(() => { btnCopy.innerText = originalText; }, 2000);
                } catch (err) {
                    console.error('Erro ao copiar:', err);
                    alert('Não foi possível copiar o texto.');
                }
            });
        });
    </script>
</body>
</html>
