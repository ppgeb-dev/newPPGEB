<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="robots" content="noindex">
    <title>Comissão - PPGEB UNIFESP</title>


    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/nav.css">    
    <link rel="stylesheet" href="styles/comissao.css">
</head>

<body>
    <!-- Header -->
    <header class="header header-blue-bg">
        <div class="header-container">
            <div class="logo">
                <img alt="Logo PPGEB" class="logo-img" src="imgs/logo.png" />
            </div>

            <nav class="nav" id="nav"></nav>

            <button class="mobile-menu-btn" id="mobile-menu-btn">
                <span>☰</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-m features-2" style="margin-top:2rem!important;">
        <div class="container">
            <!-- Page Header -->
            <section class="selection-section">
                <div class="selection-header">
                    <h2>Comissão de Ensino de Pós-Graduação</h2>
                </div>
                <div class="period-selector">
                    <label for="periodSelect">Selecione o período:</label>
                    <div class="custom-select-wrapper">
                        <select id="periodSelect" class="period-select">
                            <option disabled selected>Carregando períodos...</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Commission Section -->
            <section class="commission-section" id="commissionSection">
                <div class="">
                    <div class="titles" id="areas" style="margin-top: 1.5rem;">
                        <h1 id="periodTitle">Atual Formação</h1>
                    </div>
                </div>

                <!-- Commission Members -->
                <div class="commission-category">
                    <div class="category-header">
                        <div class="header-container-docs">
                            <img src="imgs/icons/professors.png" class="icon-docs" alt="">
                            <h2 id="comissaoTitle">Comissão de Ensino de Pós-Graduação</h2>
                        </div>
                    </div>
                    <div class="members-list">
                        <div class="no-members">
                            <p>Carregando membros da comissão...</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="JS/comissao.js"></script>
    <script src="JS/menu.js"></script>
    <script src="JS/script.js"></script>

    <script>
        carregarMenu("S");    
    </script>
</body>

</html>
