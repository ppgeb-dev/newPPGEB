name: Atualizar publicações (OpenAlex)

on:
  schedule:
    - cron: "0 6 * * 1"      # toda segunda-feira às 06:00 UTC (03:00 em Brasília)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: publicacoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar publicações no OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/atualizar_publicacoes.py

      - name: Salvar no repositório (só se mudou)
        run: |
          git config user.name "ppgeb-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JSON/publicacoes.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nas publicações."
          else
            git commit -m "chore(publicacoes): atualiza publicações a partir do OpenAlex"
            git pull --rebase
            git push
          fi